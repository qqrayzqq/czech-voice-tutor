[project]
name = "czech-voice-tutor"
version = "0.1.0"
description = "Personal Czech conversation tutor in Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31,<4",
    "httpx>=0.28.1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
czech-tutor = "czech_tutor.main:run"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/czech_tutor"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
